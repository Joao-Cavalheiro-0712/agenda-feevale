name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyflakes
      - name: Análise estática
        run: python -m pyflakes agenda wsgi.py tests
      - name: Testes
        env:
          APP_ENV: development
          DISABLE_BACKGROUND_JOBS: "1"
        run: python -m pytest -q
      - name: Verificar migrations do schema
        run: python -c "import os; os.environ['DATABASE_URL']='sqlite:///ci.db'; from agenda.db import init_db; init_db(); print('schema ok')"
