{% from 'partials/icons.html' import icon %}
<div class="sheet" id="capture-sheet" role="dialog" aria-modal="true" aria-labelledby="capture-title">
  <div class="grabber"></div>
  <h3 id="capture-title">O que apareceu?</h3>

  <form data-capture-form autocomplete="off">
    <div class="composer">
      <textarea name="text" rows="2" placeholder="prova de Civil sexta sobre contratos" aria-label="Conte o que precisa lembrar"></textarea>
      <button type="button" class="mic" onclick="toggleRecording(this)" aria-label="Gravar áudio">{{ icon('microfone') }}</button>
      <button type="submit" class="btn send" aria-label="Enviar">{{ icon('seta') }}</button>
    </div>
    <p class="help" data-capture-status role="status"></p>
  </form>

  <div data-capture-result class="stack" style="margin:var(--s4) 0"></div>

  <div class="capture-options">
    <label class="capture-option">
      <span class="ico">{{ icon('documento') }}</span>
      <span><strong>Mandar um documento</strong><small>PDF, Word, planilha, print do portal</small></span>
      <input type="file" data-capture-file class="sr-only" accept=".pdf,.doc,.docx,.xlsx,.csv,.txt,image/*">
    </label>
    <label class="capture-option">
      <span class="ico">{{ icon('camera') }}</span>
      <span><strong>Fotografar</strong><small>Quadro, mural, agenda impressa</small></span>
      <input type="file" data-capture-file class="sr-only" accept="image/*" capture="environment">
    </label>
    <a class="capture-option" href="{{ url_for('pages.assistant_page') }}">
      <span class="ico">{{ icon('grifo') }}</span>
      <span><strong>Conversar</strong><small>“O que eu tenho essa semana?”</small></span>
    </a>
  </div>

  <button type="button" class="btn ghost block" data-close-sheet style="margin-top:var(--s4)">Fechar</button>
</div>
